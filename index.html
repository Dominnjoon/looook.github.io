<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url("https://moewalls.com/wp-content/uploads/2021/05/satoru-gojo-rose-blue-jujutsu-kaisen-thumb.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: white;
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px black;
    }
    .map {
      backdrop-filter: blur(5px);
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 192, 203, 0.6);
      width: 100%;
      max-width: 400px;
    }
    button {
      padding: 10px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: bisque;
      transition: all 0.3s ease-in-out;
    }
    button:hover {
      background-color: rgb(0, 52, 136);
      color: white;
      transform: scale(1.1);
      box-shadow: 0 0 15px pink;
    }
    #coordinates {
      margin-top: 20px;
      font-size: 18px;
      color: white;
      word-break: break-word;
      text-shadow: 0 0 10px red;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      #coordinates {
        font-size: 16px;
      }
      .map {
        padding: 15px;
        width: 90%;
      }
      button {
        width: 100%;
      }
      p{
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <h1>Form (Dominjoon)</h1>
  <div class="map">
    <button onclick="getLocation()">Click</button>
    <div id="coordinates"></div>
  </div>
  <script>
    function getLocation(){
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      }else{
        document.getElementById("coordinates").innerHTML =
          "Geolocation is not supported by this browser.";
      }
    }
    function showPosition(position){
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const googleMapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
       document.getElementById("coordinates").innerHTML = `<p>
         ${latitude}<br>
         ${longitude}<br><br>
      </p> 
      `;
    }
    function showError(error) {
      let message = "";
      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = "User denied the request for Geolocation.";
          break;
        case error.POSITION_UNAVAILABLE:
          message = "Location information is unavailable.";
          break;
        case error.TIMEOUT:
          message = "The request to get user location timed out.";
          break;
        case error.UNKNOWN_ERROR:
          message = "An unknown error occurred.";
          break;
      }
      document.getElementById("coordinates").innerHTML = message;
    }
  </script>
</body>
</html>
